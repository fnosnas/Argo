name: Build js image

on:
  push:
    branches: [main]
    paths:
      - 'js/index.js'
      - 'js/package.json'
      - 'js/Dockerfile'
      - '.github/workflows/docker-js.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./js
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ws-js:latest
            ghcr.io/${{ github.repository_owner }}/ws-js:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
